name: reserva-pecas

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservas
      DB_USER: reservas
      DB_PASSWORD: reservas
      DB_POOL: ${DB_POOL:-20}
      SPRING_FLYWAY_TARGET: ${FLYWAY_TARGET:-latest}
      BUSCA_SALDO_MODO: ${BUSCA_SALDO_MODO:-LOTE}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # docker compose --profile seed run --rm seed
  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    environment:
      PGPASSWORD: reservas
    volumes: ["./scripts/seed:/seed:ro"]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["psql", "-h", "db", "-U", "reservas", "-d", "reservas", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed.sql"]

volumes:
  pgdata: