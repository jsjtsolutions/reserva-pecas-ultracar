name: reserva-pecas-cluster

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    command: ["postgres", "-c=shared_buffers=512MB", "-c=work_mem=16MB", "-c=max_connections=300"]
    volumes: ["pgdata_cluster:/var/lib/postgresql/data"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservas
      DB_USER: reservas
      DB_PASSWORD: reservas
      DB_POOL: "15"
    expose: ["8080"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 3

  lb:
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata_cluster: