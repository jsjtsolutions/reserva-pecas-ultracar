events { worker_connections 2048; }

http {
  access_log off;
  upstream api {
    server api:8080;      # DNS do Docker devolve os IPs das 3 replicas
    keepalive 64;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
  }
}